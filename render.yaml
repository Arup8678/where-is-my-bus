services:
  - type: web
    name: whereismybus-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        value: file:./prisma/prod.db
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
