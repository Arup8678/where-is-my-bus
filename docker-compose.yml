version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: whereismybus_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: whereismybus
      POSTGRES_USER: wimb_user
      POSTGRES_PASSWORD: wimb_pass_2024
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: whereismybus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@whereismybus.in
      PGADMIN_DEFAULT_PASSWORD: Admin@123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
